personalized_activity_planning_task:
  description: >
    Research and identify activities at {destination} that match the traveler's 
    preferences and demographic profile. Collaborate with the weather forecast agent 
    to ensure activities are weather-appropriate. Share the findings with the itinerary 
    compiler for inclusion in the final itinerary.

    Traveler's information:
    - origin: {origin}
    - destination: {destination}
    - age of the traveler: {age}
    - number of people: {person}
    - hotel location: {hotel_location}
    - trip duration: {trip_duration}
    - trip dates: {trip_dates}
    - preferred activities: {activities}
  expected_output: >
    A list of recommended activities and events, including:
    - Activity name, description, and why it's suitable for the traveler
    - Location/address and any available ratings or reviews
    - Weather suitability for the activity
    Pass all results to the itinerary compiler.

restaurant_scouting_task:
  description: >
    Investigate the culinary scene at {destination}. Research and recommend 
    restaurants that match the traveler's preferences and budget. Provide options 
    that align with planned activities and weather conditions.

    Traveler's information:
    - origin: {origin}
    - destination: {destination}
    - age of the traveler: {age}
    - number of people: {person}
    - hotel location: {hotel_location}
    - trip duration: {trip_duration}
    - trip dates: {trip_dates}
    - preferred activities: {activities}
  expected_output: >
    A list of recommended restaurants, including:
    - Name, type of cuisine, and a brief description of the menu
    - Location/address and available ratings or reviews
    - Suitability for different days of the trip based on activities and weather
    Share findings with the itinerary compiler.

weather_forecast_task:
  description: >
    Research and provide detailed weather forecasts for {trip_dates}. Include 
    hourly and daily weather conditions to inform activity and dining schedules.
  expected_output: >
    A comprehensive weather report including:
    - Hourly and daily forecasts for {trip_dates}
    - Expected temperatures, precipitation, and other relevant details
    Share results with the personalized activity planner and itinerary compiler.

itinerary_compilation_task:
  description: >
    Compile a detailed trip plan using only the data provided by other agents. Ensure 
    all information is integrated into a seamless day-by-day itinerary, translated 
    into {language}.
    Mandatory: use only the informations acquired by the other agents, do not search on the internet. 

    Traveler's information:
    - origin: {origin}
    - destination: {destination}
    - trip dates: {trip_dates}
    - interests: {activities}
    - number of people: {person}
    - language: {language}
  expected_output: >
    A markdown-formatted itinerary including:
    - Trip Summary: Overview of the trip
    - Travel Highlights: Key attractions and experiences
    - Daily Itinerary: Detailed schedule with activities, dining, and weather info
    - Local Cuisine: Recommended restaurants and culinary experiences
    - Addresses: Exact addresses for all activities and restaurants
    - Weather: Weather forecast for each day
    - Budget: Estimated costs for activities and dining
    - Cost Saving Tips: Suggestions for saving money
    - Additional Tips: Travel advice and recommendations
    Translate the document into the specified language: {language}.
